<template>
    <lightning-card title="CostPilot Setup" icon-name="utility:setup">
        <div class="shell">
            <template lwc:if={loading}>
                <lightning-spinner alternative-text="Loading CostPilot setup"></lightning-spinner>
            </template>
            <template lwc:elseif={errorMessage}>
                <div class="notice error" role="alert">
                    <strong>Setup could not load.</strong>
                    <span>{errorMessage}</span>
                </div>
            </template>
            <template lwc:else>
                <div class="intro">
                    <p class="eyebrow">Secure post-install setup</p>
                    <h1>Connect {state.orgName} to CostPilot</h1>
                    <p>
                        Authorize this Salesforce organization, create or select its
                        CostPilot workspace, and activate the packaged encrypted connection.
                        No API key, Apex, CLI, or Named Credential editing is required.
                    </p>
                </div>

                <ol class="steps">
                    <li class="active">
                        <span>1</span>
                        <div><strong>Connect</strong><small>Authorize this Salesforce organization</small></div>
                    </li>
                    <li>
                        <span>2</span>
                        <div><strong>Select AI entry points</strong><small>Choose Agentforce agents and Flows</small></div>
                    </li>
                    <li>
                        <span>3</span>
                        <div><strong>Verify and activate</strong><small>Send one governed test request</small></div>
                    </li>
                </ol>

                <section class="connection">
                    <div>
                        <p class="label">Salesforce organization</p>
                        <strong>{state.orgName}</strong>
                        <p class="meta">{environmentLabel} · {state.orgId}</p>
                    </div>
                    <lightning-button
                        variant="brand"
                        label="Connect to CostPilot"
                        onclick={connect}>
                    </lightning-button>
                </section>

                <p class="security">
                    Salesforce will ask an administrator to approve API access. CostPilot
                    then stores a revocable workspace credential in Salesforce encrypted storage.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
