<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ask CostPilot — Voice</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  :root {
    --navy: #0b1220;
    --navy-800: #14213d;
    --accent: #2e7df7;
    --ink: #101828;
    --ink-muted: #667085;
    --danger: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--navy); color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 420px; font-weight: 600; font-size: 15px; opacity: 0.9;
  }
  header .brand { display: flex; align-items: center; gap: 8px; }
  header img { height: 22px; width: auto; }

  /* Confirmed live 2026-09-18: this page had no workspace switcher at
     all -- it silently defaulted to a hardcoded fallback workspace
     (FALLBACK_WORKSPACE_ID below), so a question about a platform
     connected in a DIFFERENT workspace (e.g. Salesforce, active under
     "Production"/"default" but never finished connecting under the
     fallback "Simulated" workspace) got an accurate but confusing
     "not connected" answer with no way to tell from this page that a
     different workspace even existed. Small and unobtrusive by design,
     matching this page's own minimal aesthetic -- not the full labeled
     dropdown left-nav.js/global-nav.js use on desktop. */
  #workspaceSwitcher {
    font-size: 11px; font-weight: 600; color: #cbd5e1;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px; padding: 5px 10px; max-width: 150px;
    -webkit-appearance: none; appearance: none;
  }
  #workspaceSwitcher:disabled { opacity: 0.5; }

  /* Mobile-only: above this width, hide the mic UI and show a desktop
     notice instead -- this page is deliberately not meant to be used
     from a desktop browser. */
  #desktopNotice { display: none; }
  @media (min-width: 700px) {
    #app { display: none; }
    #desktopNotice { display: flex; }
  }

  #desktopNotice {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 12px; flex: 1; max-width: 380px;
  }
  #desktopNotice h1 { font-size: 20px; margin: 0; }
  #desktopNotice p { color: #cbd5e1; margin: 0; line-height: 1.5; font-size: 14px; }

  #app { display: flex; flex-direction: column; align-items: center; justify-content: space-between; flex: 1; width: 100%; }

  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 8vh; }

  /* The state-reactive avatar/ring system below is a direct port of the
     desktop drawer's .cp-ask-avatar-float (frontend/css/global-nav.css) --
     same portrait, same idle/listening/thinking/speaking states and ring
     colors, same keyframes, just applied to this page's #micButton (a
     fixed, non-draggable tap target here, not a floating panel) so mobile
     gets the same "someone's actually there" presence the desktop drawer
     already has. See that file's own comments for the full state-design
     reasoning; only the selector root and position/cursor rules differ. */
  #micButton {
    width: 128px; height: 128px; border-radius: 50%; border: none;
    background: transparent; padding: 0; position: relative;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 10px 28px rgba(0,0,0,.45));
    transition: transform 0.15s ease;
  }
  #micButton:active { transform: scale(0.96); }
  #micButton:disabled { cursor: default; }

  #micButton .cp-ask-avatar-img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    object-position: center 18%; display: block;
    transition: transform .2s ease, filter .2s ease;
  }
  #micButton .cp-ask-avatar-ring {
    position: absolute; inset: -5px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25); box-sizing: border-box;
    pointer-events: none; transition: border-color .25s ease;
  }

  /* idle -- slow, subtle organic sway + breathing */
  #micButton[data-state="idle"] .cp-ask-avatar-img {
    animation: cp-ask-avatar-sway 3.6s ease-in-out infinite, cp-ask-avatar-breathe 3.6s ease-in-out infinite;
  }
  /* listening -- alert lean-in, ring pulses blue */
  #micButton[data-state="listening"] .cp-ask-avatar-ring { border-color: var(--accent); }
  #micButton[data-state="listening"] { animation: cp-ask-avatar-listen-pulse 1.5s ease-in-out infinite; }
  #micButton[data-state="listening"] .cp-ask-avatar-img { animation: cp-ask-avatar-sway 2s ease-in-out infinite; }
  /* thinking -- continuous head tilt, ring pulses amber */
  #micButton[data-state="thinking"] .cp-ask-avatar-ring { border-color: #d29922; }
  #micButton[data-state="thinking"] .cp-ask-avatar-img { animation: cp-ask-avatar-tilt 2.2s ease-in-out infinite; }
  /* speaking -- ring pulses green, portrait pulses larger + brighter */
  #micButton[data-state="speaking"] .cp-ask-avatar-ring { border-color: #3fb950; }
  #micButton[data-state="speaking"] { animation: cp-ask-avatar-speak-glow .34s ease-in-out infinite; }
  #micButton[data-state="speaking"] .cp-ask-avatar-img { animation: cp-ask-avatar-talk-pulse .34s ease-in-out infinite; }

  @keyframes cp-ask-avatar-sway {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-2px) rotate(-1.2deg); }
  }
  @keyframes cp-ask-avatar-breathe {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(.94); }
  }
  @keyframes cp-ask-avatar-listen-pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(46,125,247,0.45)); }
    50%      { filter: drop-shadow(0 0 10px rgba(46,125,247,0.45)); }
  }
  @keyframes cp-ask-avatar-speak-glow {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(63,185,80,0.55)); }
    50%      { filter: drop-shadow(0 0 20px rgba(63,185,80,0.65)); }
  }
  @keyframes cp-ask-avatar-tilt {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-5deg); }
  }
  @keyframes cp-ask-avatar-talk-pulse {
    0%, 100%  { transform: scale(1) rotate(0deg); filter: brightness(1); }
    45%       { transform: scale(1.09) rotate(-1deg); filter: brightness(1.14); }
    70%       { transform: scale(1.05) rotate(1deg); filter: brightness(1.1); }
  }
  /* Reduced motion: animations stripped, ring color (the state signal)
     stays so state is still readable at a glance -- same contract as the
     desktop drawer's identical media query. */
  @media (prefers-reduced-motion: reduce) {
    #micButton[data-state], #micButton[data-state] .cp-ask-avatar-img { animation: none; }
  }

  #statusText { font-size: 15px; font-weight: 500; text-align: center; min-height: 20px; color: #e2e8f0; }

  #transcript, #answer {
    width: 100%; max-width: 420px; border-radius: 14px; padding: 16px;
    font-size: 15px; line-height: 1.5; display: none;
  }
  #transcript { background: rgba(255,255,255,0.06); color: #cbd5e1; font-style: italic; }
  #answer { background: #ffffff; color: var(--ink); }
  #answer p { margin: 0 0 10px; }
  #answer p:last-child { margin-bottom: 0; }
  #answer ul, #answer ol { margin: 0 0 10px; padding-left: 20px; }
  #answer strong { font-weight: 700; }
  #answer code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  #answer table.ask-markdown-table {
    width: 100%; margin: 6px 0 12px; border-collapse: collapse; font-size: 13px;
  }
  #answer table.ask-markdown-table th, #answer table.ask-markdown-table td {
    padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left;
  }
  #answer table.ask-markdown-table th {
    background: #f8fafc; color: #667085; font-size: 11px; letter-spacing: .03em; text-transform: uppercase;
  }

  /* Proposal card (renderAskProposalCard, from the shared ask-costpilot-
     render.js) -- ported from the desktop drawer's .cp-ask-proposal* rules
     in frontend/css/global-nav.css, re-themed for this page's light
     #answer background instead of the drawer's dark panel. Without this,
     a real ActionProposal created by the agent loop (visible in
     data.proposal on the response) had nowhere to render on this page at
     all -- confirmed live: the answer text described the proposal in
     prose, but no card, and no way to confirm/reject it, ever appeared. */
  #answer section { margin-top: 12px; }
  #answer section h4 { margin: 0 0 8px; font-size: 13px; color: var(--ink-muted); }
  #answer .cp-ask-proposal {
    display: grid; gap: 6px; padding: 12px;
    border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc;
  }
  #answer .cp-ask-proposal span { color: var(--ink-muted); font-size: 13px; line-height: 1.45; }
  #answer .cp-ask-proposal-actions { display: flex; gap: 8px; margin-top: 6px; }
  #answer .cp-ask-proposal-actions .cp-ask-supporting {
    flex: 1; text-align: center; color: #fff; background: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px; padding: 9px 10px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  #answer .cp-ask-proposal-actions button:not(.cp-ask-supporting) {
    flex: 1; padding: 9px 10px; color: var(--ink-muted); background: transparent;
    border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 700;
  }
  #answer .cp-ask-proposal-actions button:disabled { opacity: .5; cursor: default; }
  #answer .cp-ask-error {
    margin-top: 8px; padding: 8px 10px; font-size: 12px;
    background: rgba(220,38,38,.08); border-left: 3px solid #dc2626; color: #991b1b;
  }
  #answer.visible, #transcript.visible { display: block; }

  #stopSpeaking {
    display: none; align-items: center; gap: 8px; margin-top: 4px;
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 13px;
  }
  #stopSpeaking.visible { display: inline-flex; }

  /* One line at a time, not a busy multi-item carousel -- this page is
     deliberately minimal. Only shown while idle (not recording/busy/
     speaking); fades between questions rather than jumping. */
  #suggestionRotator {
    display: none; max-width: 320px; margin: 4px auto 0;
    background: transparent; border: none; color: #98add9;
    font-size: 14px; line-height: 1.5; text-align: center;
    opacity: 0; transition: opacity 0.6s ease;
    padding: 8px 12px; cursor: pointer;
  }
  #suggestionRotator.visible { display: block; }
  #suggestionRotator.shown { opacity: 1; }
  #suggestionRotator:active { color: #cbd6ee; }

  /* Only shown while actively recording -- lets a listening session
     (especially an auto-restarted one) be exited without whatever the
     mic picked up getting transcribed and sent as a question. */
  #cancelButton {
    display: none; margin-top: 4px;
    background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #cbd5e1;
    padding: 7px 14px; border-radius: 999px; font-size: 13px;
  }
  #cancelButton.visible { display: inline-flex; }

  #errorText { color: #fca5a5; font-size: 13px; text-align: center; min-height: 16px; }

  footer { font-size: 12px; color: #64748b; text-align: center; }

  .scroll-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; overflow-y: auto; flex: 1; padding: 24px 0; }
</style>
</head>
<body>

<header>
  <span class="brand">
    <img src="/assets/costpilot-logo-transparent.svg" alt="" />
    Ask CostPilot
  </span>
  <select id="workspaceSwitcher" aria-label="Active CostPilot workspace" disabled>
    <option>Loading…</option>
  </select>
</header>

<div id="desktopNotice">
  <h1>This page is for your phone</h1>
  <p>Ask CostPilot's one-tap voice button is designed for mobile. Open this page on your phone to use it — for the full dashboard, go to the Executive Dashboard instead.</p>
</div>

<div id="app">
  <div class="scroll-area">
    <div class="mic-wrap">
      <button id="micButton" type="button" aria-label="Tap to ask CostPilot a question" data-state="idle">
        <span class="cp-ask-avatar-ring"></span>
        <img class="cp-ask-avatar-img" src="/assets/ask-costpilot-avatar.png" alt="" width="256" height="256" />
      </button>
      <div id="statusText">Tap to ask a question</div>
      <button id="cancelButton" type="button">✕ Cancel</button>
      <div id="errorText"></div>
    </div>

    <button id="suggestionRotator" type="button" aria-label="Ask this question"></button>

    <div id="transcript"></div>
    <div id="answer"></div>
    <button id="stopSpeaking" type="button">🔊 Stop speaking</button>
  </div>
</div>

<footer>Answers come only from CostPilot's governed data.</footer>

<!-- One persistent element, "unlocked" synchronously inside the tap
     handler below -- mobile browsers (iOS Safari especially) only allow
     audio.play() when it's tied closely to a real user gesture. By the
     time the real speech reply is ready, several real awaits (transcribe,
     ask) have passed since the tap, so a brand-new Audio() created then
     gets silently blocked. Reusing the SAME element that was already
     played-from-a-real-tap earlier keeps it inside that gesture's
     permission for the rest of the page's life. -->
<audio id="voicePlayer" playsinline></audio>

<!-- Shared markdown renderer (askRenderEscapeHtml/renderAskMarkdown) --
     the same one the desktop drawer uses, per that file's own docstring:
     "Keep that rendering logic here, once, so the two UIs can't silently
     drift apart again." Loading it here instead of hand-rolling a third
     copy is what makes a markdown table (or heading/list/bold/code) show
     up as real HTML on this page too, not just raw "**"/"|" characters. -->
<script src="/js/ask-costpilot-render.js"></script>
<script>
(function () {
  const micButton = document.getElementById("micButton");
  const statusText = document.getElementById("statusText");
  const errorText = document.getElementById("errorText");
  const transcriptEl = document.getElementById("transcript");
  const answerEl = document.getElementById("answer");
  const stopSpeakingBtn = document.getElementById("stopSpeaking");
  const cancelButton = document.getElementById("cancelButton");
  const suggestionRotator = document.getElementById("suggestionRotator");

  // Same hardcoded fallback pair global-nav.js's own workspace switcher
  // uses when GET /api/workspaces hasn't resolved -- "Simulated" is the
  // real, populated demo workspace the rest of the app defaults to.
  // Only reached if resolveWorkspaceId()'s own /api/workspaces fetch also
  // fails; never used to override a workspace_id that's actually set.
  const FALLBACK_WORKSPACE_ID = "SIM-HISTORICAL-2Y";
  let resolvedWorkspaceId = null;

  function cachedWorkspaceId() {
    try {
      return localStorage.getItem("cp_workspace_id") ||
        new URLSearchParams(window.location.search).get("workspace_id") || "";
    } catch (e) { return ""; }
  }

  // A phone opening this page directly (not via the site's normal
  // navigation) never had a chance to set cp_workspace_id -- without
  // this, workspace_id was sent empty and the backend silently fell back
  // to an unrelated, generic "default" workspace's data (confirmed live
  // 2026-09-11: wildly wrong department budget caps, from that other
  // workspace's seed data, not this one's real numbers). Resolved once,
  // then cached the same way the rest of the app already does.
  async function resolveWorkspaceId() {
    const cached = cachedWorkspaceId();
    if (cached) { resolvedWorkspaceId = cached; return; }
    try {
      const res = await fetch("/api/workspaces");
      const data = await res.json().catch(() => ({}));
      const first = (data.workspaces || [])[0];
      resolvedWorkspaceId = (first && first.workspace_id) || FALLBACK_WORKSPACE_ID;
    } catch (e) {
      resolvedWorkspaceId = FALLBACK_WORKSPACE_ID;
    }
    try { localStorage.setItem("cp_workspace_id", resolvedWorkspaceId); } catch (e) {}
  }

  function getWorkspaceId() {
    return resolvedWorkspaceId || cachedWorkspaceId();
  }

  // Same fallback pair + "no saved choice -> default, not options[0]" logic
  // as left-nav.js's populateWorkspaceSwitcher() -- kept consistent so this
  // page and the rest of the app never disagree about which workspace is
  // active for the same browser. Call after resolveWorkspaceId() so the
  // dropdown's initial selection matches whatever question-answering is
  // actually about to use.
  async function populateWorkspaceSwitcher() {
    const select = document.getElementById("workspaceSwitcher");
    if (!select) return;
    const fallback = [
      { id: "4BE43240A6674314", label: "Production" },
      { id: "SIM-HISTORICAL-2Y", label: "Simulated" },
    ];
    let options = fallback;
    try {
      const response = await fetch("/api/workspaces");
      if (response.ok) {
        const data = await response.json();
        const fetched = (data.workspaces || []).map((w) => ({ id: w.workspace_id, label: w.name }));
        if (fetched.length) options = fetched;
      }
    } catch (e) {
      // fall back silently, same as resolveWorkspaceId()
    }
    const activeId = getWorkspaceId() || FALLBACK_WORKSPACE_ID;
    if (!options.some((o) => o.id === activeId)) {
      options = [{ id: activeId, label: localStorage.getItem("cp_workspace_name") || "Current workspace" }, ...options];
    }
    select.innerHTML = options.map((o) => `<option value="${o.id}"${o.id === activeId ? " selected" : ""}>${o.label}</option>`).join("");
    select.disabled = false;
    select.addEventListener("change", (event) => {
      const chosen = options.find((o) => o.id === event.target.value);
      if (!chosen) return;
      resolvedWorkspaceId = chosen.id;
      try {
        localStorage.setItem("cp_workspace_id", chosen.id);
        localStorage.setItem("cp_workspace_name", chosen.label);
      } catch (e) {}
      // Switching mid-conversation would otherwise silently mix follow-up
      // context (department/agent/period resolved against the OLD
      // workspace) into questions now meant for a different one -- clear
      // the slate the same way a manual mic tap already does for a fresh
      // exchange, per startRecording()'s own "should clear the old one"
      // comment just below.
      conversationHistory = [];
      lastConversationContext = null;
      answerEl.classList.remove("visible");
      transcriptEl.classList.remove("visible");
      setError("");
      setStatus(`Switched to ${chosen.label} — tap to ask a question`);
    });
  }

  let mediaRecorder = null;
  let audioChunks = [];
  let recording = false;
  let cancelledRecording = false;
  let busy = false;
  let isSpeaking = false;
  const voicePlayer = document.getElementById("voicePlayer");
  let audioUnlocked = false;

  // In-memory only, per your choice -- resets on reload/close, matches
  // global-nav.js's own normalizedAskPayload() convention exactly (same
  // 12-turn cap, same conversation_context round-trip: each response's
  // conversation_context becomes the next request's `context`) so this
  // page gets the same real multi-turn memory the desktop pages already
  // have, not a separate/weaker mechanism.
  let conversationHistory = [];
  let lastConversationContext = null;
  const CONTEXT_STRING_FIELDS = [
    "intent", "entity", "metric", "direction", "source_platform", "subject_entity",
    "subject_filter_name", "subject_filter_value", "model_tier", "period_key",
    "comparison_key", "usage_status", "budget_scope",
  ];
  const CONTEXT_INT_FIELDS = ["days", "result_limit", "usage_threshold"];

  function normalizeConversationContext(ctx) {
    if (!ctx || typeof ctx !== "object") return null;
    const normalized = {};
    CONTEXT_STRING_FIELDS.forEach((key) => {
      if (typeof ctx[key] === "string" && ctx[key]) normalized[key] = ctx[key];
    });
    CONTEXT_INT_FIELDS.forEach((key) => {
      const value = Number(ctx[key]);
      if (Number.isInteger(value) && value > 0) normalized[key] = value;
    });
    return Object.keys(normalized).length ? normalized : null;
  }

  function setStatus(text) { statusText.textContent = text || ""; }
  function setError(text) { errorText.textContent = text || ""; }
  function setAvatarState(state) { micButton.setAttribute("data-state", state); }

  // Shared across transcribeAndAsk() and askQuestion() -- one Cancel tap
  // during either "Transcribing..." or "Thinking..." aborts whichever
  // real network call is currently in flight, since the mic itself is
  // disabled during both and there was previously no way out at all.
  let currentAbortController = null;

  function setBusy(isBusy) {
    busy = isBusy;
    micButton.disabled = isBusy;
    cancelButton.classList.toggle("visible", isBusy);
    refreshSuggestionState();
  }

  // A curated subset of the real, verified questions from "100 Ways to
  // Ask CostPilot" -- not the full 150+, to keep repeats infrequent
  // without needing every category represented on a phone screen. Only
  // rotates while genuinely idle (not recording/busy/speaking), per
  // explicit direction -- it must never compete for attention or get
  // tapped by accident mid-flow.
  const SUGGESTED_QUESTIONS = [
    "How much have we spent on AI this month?",
    "Which department has the highest AI spend?",
    "Why did AI spend increase?",
    "What should I review first?",
    "Which agents are inactive or underused?",
    "Are there any policy violations this month?",
    "How much have we saved through context pruning?",
    "Which department is closest to going over budget?",
    "What models are we using the most?",
    "Who has the highest AI spend this month?",
    "How can we save money on AI?",
    "Is anything unusual happening with our AI usage?",
    "Which accounts have the most AI-touched activity?",
    "Show recent budget-cap decisions.",
    "What's our AI spend for the last 2 quarters?",
    "Which AI-supported work has the strongest outcomes?",
  ];
  let suggestionIndex = -1;
  let suggestionIntervalId = null;
  const SUGGESTION_CYCLE_MS = 5000;

  function isIdle() {
    return !recording && !busy && !isSpeaking;
  }

  function showNextSuggestion() {
    suggestionRotator.classList.remove("shown");
    setTimeout(() => {
      if (!isIdle()) return;
      suggestionIndex = (suggestionIndex + 1) % SUGGESTED_QUESTIONS.length;
      suggestionRotator.textContent = SUGGESTED_QUESTIONS[suggestionIndex];
      suggestionRotator.classList.add("shown");
    }, 600);
  }

  function startSuggestionRotation() {
    if (suggestionIntervalId) return;
    suggestionRotator.classList.add("visible");
    showNextSuggestion();
    suggestionIntervalId = setInterval(showNextSuggestion, SUGGESTION_CYCLE_MS);
  }

  function stopSuggestionRotation() {
    clearInterval(suggestionIntervalId);
    suggestionIntervalId = null;
    suggestionRotator.classList.remove("visible", "shown");
  }

  function refreshSuggestionState() {
    if (isIdle()) startSuggestionRotation();
    else stopSuggestionRotation();
  }

  function askSuggestion(text) {
    if (!isIdle()) return;
    stopSuggestionRotation();
    setError("");
    answerEl.classList.remove("visible");
    transcriptEl.classList.remove("visible");
    setBusy(true);
    askQuestion(text);
  }

  suggestionRotator.addEventListener("click", () => askSuggestion(suggestionRotator.textContent));

  function stopSpeaking() {
    voicePlayer.pause();
    stopSpeakingBtn.classList.remove("visible");
    isSpeaking = false;
    setAvatarState("idle");
    refreshSuggestionState();
  }

  // Called from the tap that starts recording, before getUserMedia --
  // playing (and immediately pausing) a real, silent clip here is what
  // tells iOS Safari this element is allowed to play audio later from JS,
  // even after the async transcribe/ask chain that follows. Returns the
  // play() promise so the caller can await it finishing (or failing)
  // BEFORE requesting mic access: getUserMedia's own native permission
  // prompt is a second, separate piece of browser chrome, and on a page's
  // very first mic tap (no permission granted yet) that prompt can appear
  // before this fire-and-forget play() has actually started -- confirmed
  // live 2026-09-18, first-ever mic tap in a fresh session got "browser
  // blocked audio playback" on the very first answer, self-recovering
  // only because the SECOND mic tap unlocks from a gesture with no
  // pending permission prompt racing it. Awaiting here removes the race
  // instead of relying on the documented one-retry recovery.
  function unlockAudioPlayback() {
    if (audioUnlocked) return Promise.resolve();
    voicePlayer.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    return voicePlayer.play().then(() => { voicePlayer.pause(); audioUnlocked = true; }).catch(() => {});
  }

  async function speak(text) {
    stopSpeaking();
    if (!text) return;
    try {
      setStatus("Generating voice reply…");
      const res = await fetch("/api/ask-voice/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
        signal: currentAbortController?.signal,
      });
      if (!res.ok) throw new Error("Speech unavailable from the server.");
      const blob = await res.blob();
      voicePlayer.src = URL.createObjectURL(blob);
      // Every question on this page is voice-originated (there's no typed
      // input here) -- auto-listening for a follow-up after every answer
      // is the whole point of a hands-free mobile flow, per your choice.
      // Recording itself still stops manually (tap the mic); tapping to
      // stop without saying anything ends the loop naturally via the
      // existing empty-transcript path, rather than needing a separate
      // "stop the loop" control.
      voicePlayer.onended = () => {
        stopSpeakingBtn.classList.remove("visible");
        isSpeaking = false;
        startRecording(true);
      };
      stopSpeakingBtn.classList.add("visible");
      isSpeaking = true;
      setAvatarState("speaking");
      setStatus("Speaking…");
      await voicePlayer.play();
    } catch (err) {
      stopSpeakingBtn.classList.remove("visible");
      isSpeaking = false;
      setAvatarState("idle");
      refreshSuggestionState();
      if (err?.name === "AbortError") { setStatus("Cancelled — tap to ask a question"); return; }
      setError(
        err && err.name === "NotAllowedError"
          ? "Your browser blocked audio playback — tap the mic once more to allow sound."
          : (err && err.message) || "Could not play the spoken reply — the answer is shown below instead."
      );
      setStatus("Tap to ask another question");
    }
  }

  async function askQuestion(question) {
    setAvatarState("thinking");
    setStatus("Thinking…");
    if (!resolvedWorkspaceId) await resolveWorkspaceId();
    try {
      const body = {
        question, workspace_id: getWorkspaceId() || undefined, modality: "voice",
        conversation: conversationHistory.slice(-12),
        // Without this, date-relative questions ("today," "this week")
        // were computed in UTC (AskCostPilotRequest's default) instead of
        // the user's real local day -- confirmed live 2026-09-11: at
        // 1:20pm Central, "today's spend" came back as $2.81 (the UTC
        // window, which includes ~5 hours of the previous evening in
        // Central time) instead of the real $1.52 for the actual local
        // calendar day. global-nav.js's normalizedAskPayload() already
        // sends this same real browser timezone on every request; this
        // page just never picked up that pattern.
        timezone_name: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC",
      };
      if (lastConversationContext) body.context = lastConversationContext;
      const res = await fetch("/api/reports/bot-efficiency/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: currentAbortController?.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Ask CostPilot could not answer that.");
      answerEl.innerHTML = renderAskMarkdown(data.answer) + renderAskProposalCard(data.proposal);
      answerEl.classList.add("visible");
      conversationHistory.push({ role: "user", content: question });
      conversationHistory.push({ role: "assistant", content: data.answer || "" });
      lastConversationContext = normalizeConversationContext(data.conversation_context) || lastConversationContext;
      await speak(data.answer);
    } catch (err) {
      setAvatarState("idle");
      if (err?.name === "AbortError") { setStatus("Cancelled — tap to ask a question"); return; }
      setError(err.message || "Something went wrong.");
      setStatus("Tap to try again");
    } finally {
      setBusy(false);
    }
  }

  async function transcribeAndAsk() {
    if (!audioChunks.length) { setAvatarState("idle"); setStatus("Tap to ask a question"); setBusy(false); return; }
    setAvatarState("thinking");
    setStatus("Transcribing…");
    currentAbortController = new AbortController();
    const blob = new Blob(audioChunks, { type: mediaRecorder?.mimeType || "audio/webm" });
    const form = new FormData();
    form.append("audio", blob, "question.webm");
    try {
      const res = await fetch("/api/ask-voice/transcribe", {
        method: "POST", body: form, signal: currentAbortController.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Could not transcribe that clip.");
      const transcript = (data.transcript || "").trim();
      if (!transcript) {
        setAvatarState("idle");
        setError("Didn't catch a question — tap and try again.");
        setStatus("Tap to ask a question");
        setBusy(false);
        return;
      }
      transcriptEl.textContent = "“" + transcript + "”";
      transcriptEl.classList.add("visible");
      answerEl.classList.remove("visible");
      answerEl.textContent = "";
      // Deliberate press-and-go flow -- unlike the dashboard's Ask
      // CostPilot widget (which shows the transcript for review before
      // sending), a single explicit tap-to-record-tap-to-stop gesture is
      // already the user's confirmation to ask; auto-submitting here is
      // the point of a one-button mobile flow.
      await askQuestion(transcript);
    } catch (err) {
      setAvatarState("idle");
      if (err?.name === "AbortError") { setStatus("Cancelled — tap to ask a question"); setBusy(false); return; }
      setError(err.message || "Could not transcribe that clip.");
      setStatus("Tap to try again");
      setBusy(false);
    }
  }

  // Auto-listen is meant to be conditional -- a bounded window tied to
  // an active, ongoing exchange right after CostPilot just answered
  // something, not an indefinite hot mic. Without this timeout it
  // stayed listening until the user noticed and manually tapped Cancel,
  // which is how real ambient conversation (not questions) was getting
  // captured and transcribed. A manually-tapped recording (the user
  // deliberately pressed the mic) has no timeout -- only the automatic
  // restart after an answer does.
  //
  // Replaced the original flat 7s timer (then 15s) with real silence
  // detection below (startVAD/stopVAD) -- a flat timer from the moment
  // auto-listen starts has no way to tell "still waiting for the user to
  // start talking" apart from "user is two sentences into a real
  // question," so it either cuts a real question off mid-sentence or
  // (raised generously) makes someone wait through a long fixed window
  // even for a one-word follow-up. AUTO_LISTEN_GIVE_UP_MS below now only
  // covers "never said anything at all" -- once real speech is detected,
  // VAD_SILENCE_MS (a short quiet-after-talking window) decides when
  // they're actually done, and VAD_MAX_RECORDING_MS is a hard safety cap
  // for continuous background noise that never goes quiet.
  const AUTO_LISTEN_GIVE_UP_MS = 15000;
  let autoListenTimeoutId = null;
  let autoListenTimedOut = false;

  // Real voice-activity detection via the Web Audio API instead of a
  // flat timer -- samples the mic stream's live amplitude (RMS) many
  // times a second; a level above VAD_SPEECH_THRESHOLD counts as speech
  // and (re)starts a VAD_SILENCE_MS countdown, so the countdown keeps
  // getting pushed back for as long as the user keeps talking and only
  // actually fires once they've been quiet for that long -- the stop
  // point tracks the real end of the question instead of a guess made
  // before anyone said anything. VAD_SPEECH_THRESHOLD is a reasonable
  // default for typical phone mic gain/ambient noise, not something
  // tunable from real device testing in this environment -- if it proves
  // too sensitive (stops early on breath/pause) or not sensitive enough
  // (never detects speech at all) on real devices, this is the constant
  // to adjust first.
  const VAD_SPEECH_THRESHOLD = 0.02;
  const VAD_SILENCE_MS = 1800;
  const VAD_MAX_RECORDING_MS = 30000;
  let vadAudioContext = null;
  let vadAnalyser = null;
  let vadRafId = null;
  let vadSilenceTimeoutId = null;
  let vadMaxRecordingTimeoutId = null;
  let vadHeardSpeech = false;

  function startVAD(stream) {
    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextCtor) return; // no VAD support -- AUTO_LISTEN_GIVE_UP_MS alone still bounds the recording
    try {
      vadAudioContext = new AudioContextCtor();
      const source = vadAudioContext.createMediaStreamSource(stream);
      vadAnalyser = vadAudioContext.createAnalyser();
      vadAnalyser.fftSize = 512;
      source.connect(vadAnalyser);
      const buffer = new Uint8Array(vadAnalyser.frequencyBinCount);
      vadHeardSpeech = false;

      const tick = () => {
        vadAnalyser.getByteTimeDomainData(buffer);
        let sumSquares = 0;
        for (let i = 0; i < buffer.length; i++) {
          const v = (buffer[i] - 128) / 128;
          sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / buffer.length);
        if (rms > VAD_SPEECH_THRESHOLD) {
          vadHeardSpeech = true;
          clearTimeout(vadSilenceTimeoutId);
          vadSilenceTimeoutId = setTimeout(() => {
            if (recording) stopRecording();
          }, VAD_SILENCE_MS);
        }
        vadRafId = requestAnimationFrame(tick);
      };
      tick();
      vadMaxRecordingTimeoutId = setTimeout(() => {
        if (recording) stopRecording();
      }, VAD_MAX_RECORDING_MS);
    } catch (e) {
      stopVAD(); // feature-detected above, but some browsers still throw on construction -- fall back silently
    }
  }

  function stopVAD() {
    if (vadRafId) cancelAnimationFrame(vadRafId);
    vadRafId = null;
    clearTimeout(vadSilenceTimeoutId);
    vadSilenceTimeoutId = null;
    clearTimeout(vadMaxRecordingTimeoutId);
    vadMaxRecordingTimeoutId = null;
    if (vadAudioContext) { vadAudioContext.close().catch(() => {}); }
    vadAudioContext = null;
    vadAnalyser = null;
  }

  async function startRecording(isAutoListen = false) {
    await unlockAudioPlayback();
    setError("");
    // Confirmed live (reported as "the response disappears and I can't
    // view it" on mobile): this used to clear both regardless of why
    // recording started. speak()'s onended calls startRecording(true) the
    // instant the spoken reply finishes, specifically to auto-listen for
    // a hands-free follow-up -- but that meant the just-answered text got
    // yanked off screen the moment the audio stopped, whether or not the
    // user was still reading it, on every single answer. A manual tap on
    // the mic (isAutoListen left false) still starts a fresh exchange and
    // should clear the old one; auto-listen should keep the last answer
    // visible in the background until a real new one actually replaces
    // it -- the mic can listen quietly without the screen going blank.
    if (!isAutoListen) {
      answerEl.classList.remove("visible");
      transcriptEl.classList.remove("visible");
    }
    stopSpeaking();
    if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
      setError("Voice isn't supported in this browser.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      const recordingStartedAt = Date.now();
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        clearTimeout(autoListenTimeoutId);
        stopVAD();
        stream.getTracks().forEach((t) => t.stop());
        recording = false;
        cancelButton.classList.remove("visible");
        refreshSuggestionState();
        // Explicit cancel (the "✕ Cancel" button) -- discard whatever was
        // captured entirely, no transcribe call, no auto-listen restart.
        // This is the actual exit from a listening session: auto-listen
        // (speak()'s onended) only re-arms after a real spoken ANSWER,
        // never after a cancelled recording, so cancelling here is enough
        // to fully stop the hands-free loop.
        if (cancelledRecording) {
          cancelledRecording = false;
          setAvatarState("idle");
          setStatus(autoListenTimedOut ? "Didn't hear a follow-up — tap to ask a question" : "Tap to ask a question");
          autoListenTimedOut = false;
          return;
        }
        // Cheap first line of defense before even calling the transcribe
        // API: a clip this short is essentially certain to be an
        // accidental/instant tap-to-stop with no real speech in it,
        // most likely from auto-listen starting before the user was
        // ready to talk. The backend's own no_speech_prob check (routes_
        // ask_voice.py) is the real guard against Whisper hallucinating
        // text from longer stretches of silence/ambient noise -- this
        // just skips a wasted round trip for the shortest, clearest case.
        if (Date.now() - recordingStartedAt < 600) {
          setAvatarState("idle");
          setStatus("Tap to ask a question");
          return;
        }
        setBusy(true);
        transcribeAndAsk();
      };
      mediaRecorder.start();
      recording = true;
      refreshSuggestionState();
      setAvatarState("listening");
      cancelButton.classList.add("visible");
      if (isAutoListen) {
        setStatus("Listening for a follow-up… (tap to send, or Cancel)");
        startVAD(stream);
        autoListenTimeoutId = setTimeout(() => {
          // If real speech was ever detected, VAD's own silence timer (or
          // its max-recording safety cap) owns the stop decision from here
          // -- this give-up timer is only for "never said anything at
          // all," so it backs off once vadHeardSpeech flips true instead
          // of still cutting off a real, still-in-progress answer.
          if (!recording || vadHeardSpeech) return;
          cancelledRecording = true;
          autoListenTimedOut = true;
          stopRecording();
        }, AUTO_LISTEN_GIVE_UP_MS);
      } else {
        setStatus("Listening… tap the mic to send, or Cancel to discard");
      }
    } catch (err) {
      setError("Couldn't access your microphone — check permissions.");
    }
  }

  function stopRecording() {
    mediaRecorder?.stop();
  }

  micButton.addEventListener("click", () => {
    if (busy) return;
    if (recording) stopRecording();
    else startRecording();
  });

  stopSpeakingBtn.addEventListener("click", () => {
    stopSpeaking();
    setStatus("Tap to ask another question");
  });

  cancelButton.addEventListener("click", () => {
    if (busy) {
      currentAbortController?.abort();
      return;
    }
    if (!recording) return;
    cancelledRecording = true;
    stopRecording();
  });

  // Confirm/Cancel on a rendered proposal card -- same postAskAction/
  // resolveAskProposal shape global-nav.js's drawer already uses, ported
  // here since this page renders its own answer card independently.
  async function postAskAction(path) {
    const token = localStorage.getItem("cp_auth_token");
    const headers = { "Content-Type": "application/json" };
    if (token) headers["Authorization"] = `Bearer ${token}`;
    return fetch(path, { method: "POST", headers });
  }

  async function resolveAskProposal(id, buttonEl, action) {
    const section = buttonEl.closest("section");
    if (!section) return;
    const buttons = section.querySelectorAll("button");
    buttons.forEach((btn) => { btn.disabled = true; });
    try {
      const response = await postAskAction(`/api/ask/actions/${id}/${action}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || `Request failed (${response.status})`);
      section.outerHTML = renderAskProposalCard(action === "confirm" ? data.proposal : data);
    } catch (error) {
      section.insertAdjacentHTML(
        "beforeend",
        `<div class="cp-ask-error"><span>${askRenderEscapeHtml(error.message || "This action could not be completed.")}</span></div>`,
      );
      buttons.forEach((btn) => { btn.disabled = false; });
    }
  }

  answerEl.addEventListener("click", (event) => {
    const confirmBtn = event.target.closest("[data-ask-confirm-id]");
    if (confirmBtn) { resolveAskProposal(confirmBtn.dataset.askConfirmId, confirmBtn, "confirm"); return; }
    const rejectBtn = event.target.closest("[data-ask-reject-id]");
    if (rejectBtn) resolveAskProposal(rejectBtn.dataset.askRejectId, rejectBtn, "reject");
  });

  resolveWorkspaceId().then(populateWorkspaceSwitcher);
  startSuggestionRotation();
})();
</script>
</body>
</html>
